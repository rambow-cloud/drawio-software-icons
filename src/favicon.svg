    <path id="foreground-cloud" fill="#082F6B" d="M22 384C31 356 56 339 83 339C104 339 123 348 138 364C164 348 191 350 214 364C241 365 280 393 307 429C317 442 323 457 328 474H87C52 474 26 457 17 432C12 417 13 400 22 384Z"/>
