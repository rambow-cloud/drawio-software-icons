    <rect id="tile-circle" x="130" y="302" width="51" height="51" rx="25.5" fill="#FFD166"/>
    <rect id="tile-round" x="65" y="367" width="51" height="51" rx="11" fill="#FFA34D"/>
    <path id="tile-diamond" fill="#FFE59A" d="M149.8 368.3C152.9 365.2 157.9 365.2 161 368.3L181.2 388.5C184.3 391.6 184.3 396.6 181.2 399.7L161 419.9C157.9 423 152.9 423 149.8 419.9L129.6 399.7C126.5 396.6 126.5 391.6 129.6 388.5Z"/>
