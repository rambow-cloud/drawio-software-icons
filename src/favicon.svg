    <path id="ear" fill="#082F6B" d="M207 162C229 148 251 149 265 159C282 170 285 193 315 205C282 229 243 216 226 194C218 184 212 173 207 162Z"/>
    <path id="eye" fill="#082F6B" d="M345 212C368 202 390 208 401 239C391 231 384 233 376 232C363 231 364 219 345 212Z"/>
    <path id="eye-glint" fill="#FFFFFF" d="M374 217C380 214 385 217 386 220C381 223 376 222 374 217Z"/>
    <path id="nose" fill="#082F6B" d="M455 268L482 277C482 295 470 310 456 310C445 310 436 304 432 293C443 301 452 303 458 297C466 289 454 286 450 278L446 265Z"/>
    <path id="neck" fill="#082F6B" d="M327 245C319 273 336 295 369 296C396 296 408 312 416 326C401 329 388 312 381 310C365 307 366 325 376 342C404 389 387 429 352 461C376 415 359 383 337 355C309 320 303 281 327 245Z"/>
