<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rambow Icons</title>
  <desc id="desc">A right-facing ram with a curled horn above a cloud, paired with four icon tiles.</desc>
  <g id="brand-mark">
    <!-- Cyan crown and cloud keep the original brand silhouette. -->
    <path id="crown" fill="#00A9F4" d="M164 75C203 40 247 27 288 33C360 42 414 101 414 187L403 227L330 201L276 126Z"/>
    <path id="cloud" fill="#00A9F4" d="M86 293C52 305 28 335 28 373C12 390 10 415 21 436C33 461 58 474 87 474H433C468 474 492 451 492 420C492 389 468 365 438 365C425 365 415 368 405 374C393 329 356 302 310 306C294 260 245 238 201 257C158 240 108 257 86 293Z"/>
    <!-- The face remains a single clean silhouette rather than tiny traced fragments. -->
