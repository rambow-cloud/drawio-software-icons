name: Icon request or correction
description: Request new icons or correct artwork, names, metadata or categories.
title: "[Icon] "
body:
  - type: markdown
    attributes:
      value: |
        Please write this issue in English and search existing icons and issues first. Create the issue before committing a change. Both websites use this repository.
  - type: dropdown
    id: request_type
    attributes:
      label: Request type
      options:
        - Add icons
        - Correct artwork
        - Update names, metadata or categories
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product names and aliases
      description: List all requested projects; include localized aliases when known.
      placeholder: Karpenter, KEDA
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Official homepages or repositories
      placeholder: https://ubuntu.com
    validations:
      required: true
  - type: dropdown
    id: collection
    attributes:
      label: Icon collection
      options:
        - General Software
        - Alibaba Cloud
        - Unsure
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Suggested category
      description: Prefer an existing category; leave blank if unsure.
      placeholder: Cloud & Infrastructure
  - type: textarea
    id: details
    attributes:
      label: Use case and expected result
      description: Describe how the icons will be used. For corrections, identify the current icon and the problem.
    validations:
      required: true
  - type: textarea
    id: artwork
    attributes:
      label: Artwork links and references
      description: Prefer official SVG or PNG sources and brand pages. Leave blank if no source is known.
  - type: textarea
    id: rights
    attributes:
      label: Artwork license or brand guidelines
      description: Software licenses do not establish artwork permissions. Links or an Unknown response are welcome.
