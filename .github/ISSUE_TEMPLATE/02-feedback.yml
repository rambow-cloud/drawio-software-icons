name: Bug report
description: Report a website, search, download, import or MCP problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please write this issue in English. For missing or incorrect icons, use the icon request form. Create an issue before committing a fix.
  - type: textarea
    id: problem
    attributes:
      label: Actual behavior
      description: What failed, and how does it affect you?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps and environment
      description: Include steps, the site URL, browser and OS, and applicable draw.io or MCP versions.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Screenshots, errors or references
      description: Optional supporting information. Remove private data from screenshots and configuration snippets.
