name: Publish icons skill to npm
on:
  push:
    branches: [main]
    paths:
      - 'skills/rambow-icons/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-icons-skill-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install a known OIDC-capable npm CLI
        run: npm install --global npm@12.2.1 --registry=https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: Test the installer, artwork helper and release rules
        run: node --test tests/skill-installer.test.mjs tests/skill-icons.test.mjs tests/skill-release.test.mjs
      - name: Inspect the actual npm package
        run: npm pack ./skills/rambow-icons --dry-run --json > "$RUNNER_TEMP/skill-pack.json"
      - name: Determine whether new package content needs publishing
        id: release
        run: node scripts/prepare-skill-release.mjs "$RUNNER_TEMP/skill-pack.json"
      - name: Publish the organization-scoped skill with OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm publish ./skills/rambow-icons --access public --registry=https://registry.npmjs.org
