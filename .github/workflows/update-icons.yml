name: Check upstream icons
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
concurrency:
  group: icon-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore icon download cache
        uses: actions/cache@v5
        with:
          path: .sync-stage/cache
          key: icon-downloads-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            icon-downloads-v1-${{ runner.os }}-
      - run: npm run sync -- --update
      - name: Create or reuse the update issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-icon-update.mjs
      - name: Check the proposed files without a publishing build
        if: steps.issue.outputs.issue_number != ''
        run: npm run check:pr
      - name: Create or update review PR
        if: steps.issue.outputs.issue_number != ''
        id: pr
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: ${{ steps.issue.outputs.branch }}
          delete-branch: true
          title: 'chore: refresh selected software icons'
          commit-message: 'chore: refresh selected software icons and provenance'
          body-path: .update-summary.md
          add-paths: |
            data/catalog.json
            data/sources.lock.json
            data/icon-inputs.lock.json
            data/official-icons.json
            data/changelog.json
            assets/icons
            licenses
      - name: Run required checks on the automation feature branch
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          FEATURE_BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-checks.yml/dispatches" \
            --method POST -f "ref=$FEATURE_BRANCH" -f "inputs[pr_number]=$PR_NUMBER"
